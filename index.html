<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ColorSlides</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d4fb8"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#dfe5ee;--pn:#fff;--tx:#1f2937;--mu:#6b7280;--ac:#2563eb;--ad:#1d4ed8;--bd:#d3dbe8;--ch:#eef3fb;--rb:#f5f8fc;--hv:#e4ecf9;--sl:#cddffb;--tb:#1d4fb8}
body.dk{--bg:#0b1220;--pn:#152038;--tx:#e6ebf5;--mu:#9aa8c2;--ac:#6ea8ff;--ad:#8bb8ff;--bd:#2a3a55;--ch:#1b2a46;--rb:#111b30;--hv:#22355a;--sl:#2d4a7c;--tb:#0f2a66}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-user-select:none;user-select:none}
button,select,input,textarea{font-family:inherit;font-size:inherit}button{color:inherit}
.ic{display:block;flex:none;pointer-events:none}
#top{background:var(--tb);color:#fff;height:44px;display:flex;align-items:center;gap:4px;padding:0 10px;flex:none}
body.desk #top{-webkit-app-region:drag;padding-right:150px}body.desk #top button,body.desk #top input{-webkit-app-region:no-drag}
#top .lg{width:24px;height:24px;border-radius:6px;margin-right:4px}
#top .ttl{font-size:15px;font-weight:600;margin:0 10px 0 2px;white-space:nowrap}
.tq{background:none;border:0;color:#fff;width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tq:hover{background:rgba(255,255,255,.18)}
#top .dn{flex:1;display:flex;justify-content:center;min-width:0}
#fn{background:rgba(255,255,255,.14);border:1px solid transparent;color:#fff;border-radius:6px;padding:5px 10px;width:min(320px,100%);text-align:center;font-size:13.5px;outline:0}
#fn:focus{background:#fff;color:#111}
#top .play{background:#fff;color:var(--tb);border:0;border-radius:6px;height:30px;padding:0 12px 0 8px;display:flex;align-items:center;gap:6px;font-weight:600;cursor:pointer;margin-left:6px;flex:none}
#top .play:hover{background:#e6efff}
#tabs{display:flex;align-items:flex-end;background:var(--pn);padding:0 8px;height:38px;border-bottom:1px solid var(--bd);flex:none;overflow-x:auto;scrollbar-width:none}
#tabs button{border:0;background:none;padding:0 16px;height:34px;font-size:13.5px;cursor:pointer;border-radius:6px 6px 0 0;position:relative;white-space:nowrap;flex:none}
#tabs button:hover{background:var(--hv)}#tabs button.on{color:var(--ad);font-weight:600}
#tabs button.on:after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--ac);border-radius:3px 3px 0 0}
#rib{background:var(--rb);border-bottom:1px solid var(--bd);display:flex;align-items:stretch;padding:5px 6px;height:92px;flex:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.g{display:flex;flex-direction:column;border-right:1px solid var(--bd);padding:0 8px;flex:none}
.g:last-child{border:0}
.gb{flex:1;display:flex;align-items:center;gap:2px}
.gl{text-align:center;font-size:11px;color:var(--mu);padding-top:2px;white-space:nowrap}
.col{display:flex;flex-direction:column;gap:2px;justify-content:center}.row{display:flex;gap:2px;align-items:center}
.b{border:1px solid transparent;background:none;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;height:62px;padding:3px 6px;font-size:11.5px;line-height:1.1;text-align:center}
.b:hover,.s:hover{background:var(--hv);border-color:var(--bd)}
.b.on,.s.on{background:var(--sl);border-color:var(--ac)}
.s{border:1px solid transparent;background:none;border-radius:5px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.s.w{width:auto;padding:0 8px;gap:5px}
select,.nb{height:28px;border:1px solid var(--bd);border-radius:5px;background:var(--pn);color:var(--tx);padding:0 4px}
.sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.25);flex:none}
.cb{position:relative}.cb .bar{position:absolute;left:6px;right:6px;bottom:4px;height:4px;border-radius:2px}
.th{width:62px;height:44px;border-radius:6px;border:1px solid var(--bd);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:2px;font-weight:600}
.th:hover{outline:2px solid var(--ac)}
#main{flex:1;display:flex;min-height:0}
#thumbs{width:190px;flex:none;background:var(--pn);border-right:1px solid var(--bd);overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:10px}
body.nothumbs #thumbs{display:none}
.tn{display:flex;gap:6px;align-items:flex-start;cursor:pointer;border-radius:6px;padding:3px}
.tn .no{width:16px;font-size:11px;color:var(--mu);text-align:right;padding-top:2px}
.tn .tc{position:relative;border:2px solid var(--bd);border-radius:4px;overflow:hidden;background:#fff;flex:none}
.tn.on .tc{border-color:var(--ac);box-shadow:0 0 0 2px var(--sl)}
.tn:hover .tc{border-color:var(--ac)}
#cvw{flex:1;display:flex;flex-direction:column;min-width:0}
#cv{flex:1;overflow:auto;display:flex;padding:20px;min-height:0;background:var(--bg)}
#sw{margin:auto;position:relative;flex:none;box-shadow:0 4px 22px rgba(15,35,80,.28)}
#st{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0}
#notes{height:78px;flex:none;border-top:1px solid var(--bd);background:var(--pn);display:flex;flex-direction:column}
body.nonotes #notes{display:none}
#notes label{font-size:11px;color:var(--mu);padding:3px 10px 0}
#nt{flex:1;border:0;resize:none;background:transparent;color:var(--tx);padding:2px 10px 6px;outline:0;-webkit-user-select:text;user-select:text}
#stat{height:28px;flex:none;background:var(--pn);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;color:var(--mu);font-size:12px}
#stat .sp{flex:1}#stat button{border:0;background:none;cursor:pointer;width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center}
#stat button:hover{background:var(--hv)}
/* slide objects */
.sl{position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden}
.ob{position:absolute}
.ob img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
.ob svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tx{position:absolute;inset:0;padding:8px;display:flex;flex-direction:column;overflow:hidden;line-height:1.2;white-space:pre-wrap;word-break:break-word;pointer-events:none}
.tx .p{min-height:1.2em}.tx .p.bu{padding-left:.9em;position:relative}.tx .p.bu:before{content:"\2022";position:absolute;left:0}
.tx.ph:empty:before{content:attr(data-p);opacity:.45;font-style:italic;font-weight:400}
.tx.ed{pointer-events:auto;outline:2px dashed #60a5fa;outline-offset:-2px;-webkit-user-select:text;user-select:text;cursor:text;overflow:visible;display:block}
.pv .tx.ph:empty:before{content:none}
#ov{position:absolute;left:0;top:0;width:960px;height:540px;pointer-events:none;transform-origin:0 0}
.sb{position:absolute;border:2px solid #2563eb;pointer-events:none}
.hd{position:absolute;background:#fff;border:2px solid #2563eb;border-radius:50%;pointer-events:auto;touch-action:none}
/* popups, dialogs */
#pop{position:fixed;z-index:50;background:var(--pn);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:6px;display:none;max-height:75vh;overflow:auto}
.mi{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:5px;cursor:pointer;white-space:nowrap;border:0;background:none;width:100%;text-align:left}
.mi:hover{background:var(--hv)}.mi.sep{border-top:1px solid var(--bd);margin-top:4px;padding-top:0;pointer-events:none;height:4px}
.pal{display:grid;grid-template-columns:repeat(7,24px);gap:5px;padding:4px}
.pal i{width:24px;height:24px;border-radius:5px;border:1px solid rgba(0,0,0,.22);cursor:pointer}
.lay{display:grid;grid-template-columns:repeat(3,96px);gap:8px;padding:4px}
.lay div{cursor:pointer;text-align:center;font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:4px}
.lay div:hover{border-color:var(--ac);background:var(--hv)}
.lay .lp{height:46px;background:#fff;border:1px solid #ccd;margin-bottom:3px;position:relative}.lay .lp b{position:absolute;background:#9db8ea;border-radius:2px}
#dlgb{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:80;display:none;align-items:center;justify-content:center}
#dlg{background:var(--pn);border-radius:12px;padding:20px 24px;max-width:460px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#dlg h3{margin:0 0 10px;font-size:17px;color:var(--ad)}#dlg p{margin:0 0 14px;line-height:1.5}
#dlg .bt{display:flex;justify-content:flex-end;gap:8px}
#dlg button{border:1px solid var(--bd);background:var(--pn);border-radius:6px;padding:7px 16px;cursor:pointer}#dlg button.pr{background:var(--ac);color:#fff;border-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:50px;transform:translateX(-50%);background:#111c33;color:#fff;padding:8px 16px;border-radius:8px;z-index:90;display:none;font-size:13px}
/* slideshow */
#show{position:fixed;inset:0;background:#000;z-index:100;display:none;overflow:hidden;cursor:none}
#show .sl{transform-origin:0 0;animation:fi .35s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
#sctl{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(20,30,60,.8);border-radius:24px;padding:5px 10px;opacity:0;transition:opacity .3s;color:#fff;align-items:center}
#show.hv #sctl{opacity:1}#show.hv{cursor:default}
#sctl button{background:none;border:0;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}#sctl button:hover{background:rgba(255,255,255,.2)}
#prt{display:none}
@media print{
 @page{size:960px 540px;margin:0}
 html,body{height:auto;overflow:visible;background:#fff}
 body>*:not(#prt){display:none!important}
 #prt{display:block}
 #prt .pg{width:960px;height:540px;position:relative;overflow:hidden;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:820px){#thumbs{width:130px}.b{min-width:46px}}
</style></head><body>
<div id="top"></div><div id="tabs"></div><div id="rib"></div>
<div id="main"><div id="thumbs"></div>
<div id="cvw"><div id="cv"><div id="sw"><div id="st"></div><div id="ov"></div></div></div>
<div id="notes"><label>Speaker notes</label><textarea id="nt" placeholder="Click to add notes"></textarea></div>
<div id="stat"><span id="pg"></span><span class="sp"></span><button data-a="zout" title="Zoom out"></button><span id="zl" style="min-width:42px;text-align:center"></span><button data-a="zin" title="Zoom in"></button><button data-a="zfit" title="Fit slide to window"></button></div></div></div>
<div id="pop"></div><div id="dlgb"><div id="dlg"></div></div><div id="toast"></div>
<div id="show"><div id="sctl"><button data-a="sprev" title="Previous"></button><span id="spg" style="min-width:56px;text-align:center"></span><button data-a="snext" title="Next"></button><button data-a="sexit" title="Exit (Esc)"></button></div></div>
<div id="prt"></div>
<input type="file" id="fpic" accept="image/*" hidden><input type="file" id="fopen" accept=".cslides,.json,.pptx" hidden>
